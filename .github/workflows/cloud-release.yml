name: Cloud release verification
on:
  push:
    branches: [codex/lexflow-contract-fix-20261029]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: service:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: service/requirements-cloud.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the cloud runtime dependencies
        run: python -m pip install -r service/requirements-cloud.lock.txt
      - name: Python behavior and agency regressions
        run: |
          python -m unittest discover -s service/tests -v
          python -m unittest discover -s desktop/tests -v
          python -m unittest discover -s tests -v
      - name: Browser logic and Worker contracts
        run: |
          node --test tests/*.test.mjs
          node --test service/tests/*.test.cjs
      - name: Build an allowlisted release from this exact commit
        run: |
          mkdir -p dist
          python tools/build_cloud_release.py --output dist/cloud-release > dist/release-receipt.json
          cp dist/cloud-release/development-release.json dist/development-release.json
      - name: Build and exercise the non-root container and persistent volume
        run: |
          release_id=$(python -c "import json; print(json.load(open('dist/development-release.json'))['release_id'])")
          docker build --build-arg SOURCE_COMMIT=${{ github.sha }} --build-arg RELEASE_ID="$release_id" -f dist/cloud-release/deploy/Dockerfile -t gongmudam-ci:${{ github.sha }} dist/cloud-release
          python tools/cloud_smoke.py --image gongmudam-ci:${{ github.sha }}
          docker save gongmudam-ci:${{ github.sha }} | gzip > dist/gongmudam-image.tar.gz
          docker image inspect --format '{{.Id}}' gongmudam-ci:${{ github.sha }} > dist/image-id.txt
          (cd dist && sha256sum cloud-release.tar.gz gongmudam-image.tar.gz development-release.json image-id.txt > SHA256SUMS)
      - name: Publish reviewable deployment artifacts, without deploying
        uses: actions/upload-artifact@v4
        with:
          name: gongmudam-cloud-${{ github.sha }}
          path: |
            dist/cloud-release.tar.gz
            dist/gongmudam-image.tar.gz
            dist/development-release.json
            dist/release-receipt.json
            dist/image-id.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
